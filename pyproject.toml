[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "libclaim"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "google-genai==2.33.0",
    "opencv-python==5.0.0.93",
    "numpy==2.5.4",
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "pyyaml==6.0.3",
    "rapidfuzz==3.14.6",
    "jinja2==3.1.6",
    "rapidocr==3.10.0",
    "onnxruntime-directml==1.24.4",
    "aiolimiter==1.3.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
ml = [
    "torch==2.14.1",
    "torchvision",
    "transformers",
]

[tool.setuptools.packages.find]
include = ["libclaim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
