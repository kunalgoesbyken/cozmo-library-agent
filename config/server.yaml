host: 127.0.0.1
min_token_length: 24
max_preauth_bytes: 2048
max_unauthenticated: 4
max_unauthenticated_per_client: 2
trust_forwarded_host: false
trust_proxy_headers: true
allowed_origin_suffixes:
  - .trycloudflare.com
max_sessions: 1
hello_timeout_seconds: 10
ws_max_size_bytes: 9000000
max_image_pixels: 8294400
max_stills_per_sweep: 6000
max_sweep_bytes: 2000000000
report_files:
  - claim_packet.json
  - report.html
public_dirs:
  - frames
errors:
  limit: This sweep has reached its storage limit.
  storage: Could not save a frame, check free disk space.
  budget: The spending limit for this session was reached, so the voice guide has stopped.
max_header_bytes: 4096
max_mic_bytes: 8192
max_frame_bytes: 8388608
state_poll_seconds: 0.2
unassigned_region: sweep
alerts:
  blur:
    severity: warn
    say: Hold steady, that is blurry.
  glare:
    severity: warn
    say: There is glare, tilt the camera slightly.
  too_fast:
    severity: warn
    say: Slow down, you are moving too fast.
  occluded:
    severity: warn
    say: Something is blocking the view.
  too_far:
    severity: info
    say: Move a little closer.
  missed_region:
    severity: info
    say: We missed a spot, go back over it.
