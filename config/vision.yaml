tiles:
  cols: 2
  rows: 1
  overlap: 0.1
jpeg_quality: 90
jpeg_mime: image/jpeg
box_scale: 1000
nms_iou: 0.6
nms_containment: 0.8
prompt: >-
  The images are tiles of one photo of books on a shelf, numbered by image_index starting at 0.
  For every visible book spine, including partially visible and horizontally stacked books,
  return its 2D bounding box box_2d as [ymin, xmin, ymax, xmax] normalised to 0-1000 within
  its own image, the image_index it appears in, and its orientation (vertical for standing
  books, horizontal for lying or stacked books).
rfdetr:
  model_path: _scratch/models/rfdetr-nano-bookshelf.onnx
  path_env: LIBCLAIM_RFDETR_PATH
  input_size: 384
  threshold: 0.5
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  boxes_output: dets
  logits_output: labels
  providers: [DmlExecutionProvider, CPUExecutionProvider]
reconcile:
  match_iou: 0.5
  count_diff_fraction: 0.10
  gap_thickness_factor: 1.5
  max_requery_rows: 5
  phantom_containment: 0.5
  vertical_min_aspect: 1.0
  sweep_label: sweep
tracks:
  orb_features: 2000
  match_ratio: 0.75
  ransac_reproj_px: 4.0
  min_inliers: 15
  track_iou: 0.5
  anchor_lookback: 3
  det_min: 0.5
  det_max: 2.0
  area_ratio_min: 0.5
  area_ratio_max: 2.0
scale:
  aruco_dictionary: DICT_4X4_50
  corner_refinement: CORNER_REFINE_SUBPIX
  min_marker_px: 100
  aruco_confidence: 0.85
  chained_confidence_factor: 0.8
  prior_confidence: 0.3
  spine_recess_cm: 2.5
  box_height_trim: 0.0
  focal_key: fx
  fallback_long_side_fov_deg: 69.0
  shared_gap_factor: 0.5
  cross_check_tolerance: 0.10
  length_units_cm:
    centimeters: 1.0
    centimetres: 1.0
    cm: 1.0
    millimeters: 0.1
    millimetres: 0.1
    mm: 0.1
    inches: 2.54
    inch: 2.54
    in: 2.54
masks:
  model_id: facebook/sam2.1-hiera-small
  band: 0.5
markers:
  print_size_cm: 16.0
  check_line_cm: 10.0
  line_width_cm: 0.05
  page_cm: [21.0, 29.7]
  margin_cm: 2.0
  gap_cm: 1.5
  label_height_cm: 0.4
  dpi: 300
items:
  batch_size: 4
  prompt: >-
    The images are photos of one room, each preceded by its image_index. List every distinct
    object that is not a book in every image, including small ones; if an object appears in
    several images, list it once for each image it appears in. For each object return the
    image_index, its category, a short description, brand_model_text with only the brand or
    model characters printed visibly on the object (empty if none), box_2d as
    [ymin, xmin, ymax, xmax] normalised to 0-1000 within that image, is_art true for paintings,
    prints, posters, framed photos and sculptures, and truncated true if the image edge cuts
    the object off.
  art_categories: [artwork]
  dedup_iou: 0.3
  dedup_lookback: 2
  depth_core: 0.5
