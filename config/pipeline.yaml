deadline_s: 240
vision_cutoff_s: 150
deadline_poll_s: 0.5
row_min_spines: 1
row_min_spine_height_frac: 0.2
segment_max_frames: 12
revisit_tails: 4
recapture_region: "shelf at {seconds} s"
recapture_max_age_ms: 5000
shelf_size_note: "shelved wall area uses lower-bound shelf sizes: width is the longest measured run of spines, height is the sum of the tallest spine per row; shelf boards and headroom are not measured"
statement_subject_match: 80
stage_aliases:
  price: pricing
packet_name: claim_packet.json
llm_cache_dir: llm
runs_url: /runs
cm_decimals: 1
severity:
  failure: high
  unfinished: high
  reconcile: medium
  scale_prior: medium
  scale: low
  cross_check: low
  identification: low
  pricing: medium
  room: medium
  items: low
  excluded: medium
  revisit: low
  statements: medium
money_format: ",.0f"
area_format: ".1f"
summary:
  books: "I counted {book_count} books: {books_identified} identified, {books_unidentified} I could not read, and {books_needs_appraisal} set aside for an appraiser."
  book_value: "Replacing the priced books would cost about {books_replacement_cost} {currency}, and their used value is about {books_used_value} {currency}."
  items: "I logged {item_count} other items; the priced ones come to between {items_low} and {items_high} {currency} to replace."
  room: "The floor is {floor_area_m2} square metres and the walls are {wall_area_m2} square metres."
  no_room: "I could not measure the size of the room from this sweep."
  review: "{review_count} lines need a check by a person."
billing:
  free: "billed: $0 expected on the Gemini free tier (FREE_TIER=true)"
  paid: "billed at the paid rates above (FREE_TIER=false)"
  unknown: "unknown billing: set FREE_TIER in .env to true or false"
readback:
  instruction: Read this summary to the user word for word. Do not add, round or change any number.
