<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Library sweep</title>
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<header>
  <h1>Library sweep</h1>
  <span id="connection" data-tone="idle">idle</span>
</header>
<main>
  <div class="stage">
    <video id="preview" playsinline muted autoplay></video>
    <div id="toasts" aria-live="polite"></div>
  </div>
  <div id="coverage" aria-label="Coverage"></div>
  <div class="controls">
    <button id="start" type="button">Start sweep</button>
    <button id="end" type="button" hidden>End sweep</button>
  </div>
  <div id="result"></div>
  <section>
    <h2>Inventory <span id="count">0</span></h2>
    <ul id="inventory"></ul>
  </section>
  <section>
    <h2>Conversation</h2>
    <div id="transcript"></div>
  </section>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
